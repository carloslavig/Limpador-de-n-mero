<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Limpador de Número</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --accent: #e8ff47;
      --accent-dim: rgba(232, 255, 71, 0.08);
      --text: #f0f0f0;
      --muted: #555;
      --mono: 'Space Mono', monospace;
      --display: 'Syne', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--display);
      overflow-x: hidden;
    }

    /* noise grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      gap: 0;
    }

    /* decorative line top */
    .deco-line {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .label-tag {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.25rem 0.75rem;
      display: inline-block;
      margin-bottom: 1.2rem;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards 0.1s;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(2.2rem, 6vw, 4rem);
      line-height: 1;
      letter-spacing: -0.03em;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards 0.25s;
    }

    h1 span { color: var(--accent); }

    .subtitle {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.8rem;
      letter-spacing: 0.05em;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards 0.4s;
    }

    /* Card */
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2.5rem 2rem;
      position: relative;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards 0.55s;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -1px; left: 2rem; right: 2rem;
      height: 1px;
      background: var(--accent);
    }

    .field-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.6rem;
      display: block;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 1.1rem;
      padding: 0.9rem 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      letter-spacing: 0.05em;
    }

    input[type="text"]::placeholder { color: #333; }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .btn {
      width: 100%;
      background: var(--accent);
      color: #0a0a0a;
      font-family: var(--display);
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border: none;
      padding: 1rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:hover { background: #d4eb2e; }
    .btn:active { transform: scale(0.98); }

    .btn .btn-inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    /* Result area */
    .result-wrap {
      margin-top: 1.8rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
      display: none;
    }

    .result-wrap.show { display: block; animation: fadeUp 0.3s ease; }

    .result-box {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: border-color 0.2s;
    }

    .result-box.flash {
      border-color: var(--accent);
      animation: flashBorder 0.4s ease;
    }

    .result-number {
      font-family: var(--mono);
      font-size: 1.2rem;
      letter-spacing: 0.08em;
      color: var(--accent);
      word-break: break-all;
    }

    .copy-btn {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .copy-btn.copied { border-color: var(--accent); color: var(--accent); }

    .char-count {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.6rem;
      letter-spacing: 0.05em;
    }

    /* empty state */
    .empty-msg {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: #ff5f5f;
      margin-top: 1.5rem;
      display: none;
      text-align: center;
      letter-spacing: 0.05em;
    }

    .empty-msg.show { display: block; animation: fadeUp 0.25s ease; }

    /* multiple lines */
    .multi-note {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 0.4rem;
      letter-spacing: 0.05em;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes flashBorder {
      0%   { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-dim); }
      100% { border-color: var(--border); box-shadow: none; }
    }

    footer {
      margin-top: 3rem;
      font-family: var(--mono);
      font-size: 0.6rem;
      color: #2a2a2a;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards 0.8s;
    }
  </style>
</head>
<body>
  <div class="deco-line"></div>
  <div class="wrapper">
    <header>
      <div class="label-tag">Utilitário</div>
      <h1>Limpa<span>Número</span></h1>
      <p class="subtitle">// remove tudo que não é dígito</p>
    </header>

    <div class="card">
      <label class="field-label" for="inputNum">Número com formatação</label>
      <div class="input-wrap">
        <input
          type="text"
          id="inputNum"
          placeholder="(66) 91737-2773"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <p class="multi-note">// cole um número por linha para processar vários de uma vez</p>

      <button class="btn" id="cleanBtn">
        <span class="btn-inner">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
          Limpar Número
        </span>
      </button>

      <div class="empty-msg" id="emptyMsg">⚠ nenhum dígito encontrado na entrada</div>

      <div class="result-wrap" id="resultWrap">
        <span class="field-label">Resultado</span>
        <div class="result-box" id="resultBox">
          <span class="result-number" id="resultNum"></span>
          <button class="copy-btn" id="copyBtn">Copiar</button>
        </div>
        <p class="char-count" id="charCount"></p>
      </div>
    </div>

    <footer>carlos lavigne · limpador de número</footer>
  </div>

  <script>
    const input    = document.getElementById('inputNum');
    const cleanBtn = document.getElementById('cleanBtn');
    const resultWrap = document.getElementById('resultWrap');
    const resultBox  = document.getElementById('resultBox');
    const resultNum  = document.getElementById('resultNum');
    const copyBtn    = document.getElementById('copyBtn');
    const charCount  = document.getElementById('charCount');
    const emptyMsg   = document.getElementById('emptyMsg');

    function clean() {
      const raw = input.value;
      if (!raw.trim()) return;

      // suporte a múltiplas linhas
      const lines = raw.split('\n').map(l => l.replace(/\D/g, '')).filter(l => l.length > 0);
      const result = lines.join('\n');

      emptyMsg.classList.remove('show');
      resultWrap.classList.remove('show');

      if (!result) {
        emptyMsg.classList.add('show');
        return;
      }

      resultNum.textContent = result;
      const totalDigits = result.replace(/\n/g, '').length;
      charCount.textContent = `// ${totalDigits} dígito${totalDigits !== 1 ? 's' : ''}${lines.length > 1 ? ` · ${lines.length} linhas` : ''}`;

      resultWrap.classList.add('show');
      resultBox.classList.remove('flash');
      void resultBox.offsetWidth;
      resultBox.classList.add('flash');

      copyBtn.textContent = 'Copiar';
      copyBtn.classList.remove('copied');
    }

    cleanBtn.addEventListener('click', clean);

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') clean();
    });

    // live clean ao digitar
    input.addEventListener('input', () => {
      if (resultWrap.classList.contains('show')) clean();
    });

    copyBtn.addEventListener('click', () => {
      const text = resultNum.textContent;
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = 'Copiado!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copiar';
          copyBtn.classList.remove('copied');
        }, 2000);
      });
    });
  </script>
</body>
</html>
